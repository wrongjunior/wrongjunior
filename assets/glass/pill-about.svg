<svg xmlns="http://www.w3.org/2000/svg" width="520" height="90" viewBox="0 0 520 90">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>

    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>

    <radialGradient id="blobA" cx="18%" cy="25%" r="70%">
      <stop offset="0" stop-color="#7CF7FF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#7CF7FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blobB" cx="88%" cy="70%" r="80%">
      <stop offset="0" stop-color="#9B7CFF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#9B7CFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="dot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7CF7FF"/>
      <stop offset="1" stop-color="#9B7CFF"/>
    </linearGradient>
  </defs>

  <!-- Glass body (fills full canvas: no extra padding) -->
  <rect x="0.5" y="0.5" width="519" height="89" rx="28" fill="url(#base)" stroke="url(#stroke)"/>
  <rect x="0.5" y="0.5" width="519" height="89" rx="28" fill="url(#sheen)"/>

  <!-- Liquid accents (no blur/filter; чисто и стабильно на GitHub) -->
  <rect x="0.5" y="0.5" width="519" height="89" rx="28" fill="url(#blobA)"/>
  <rect x="0.5" y="0.5" width="519" height="89" rx="28" fill="url(#blobB)"/>

  <!-- Micro highlights (iOS-like) -->
  <path d="M26 14H494" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1"/>
  <path d="M26 76H494" stroke="#000000" stroke-opacity="0.18" stroke-width="1"/>

  <!-- Icon dot -->
  <circle cx="58" cy="45" r="12" fill="url(#dot)" opacity="0.95"/>
  <circle cx="54" cy="41" r="4" fill="#FFFFFF" opacity="0.18"/>

  <!-- Title -->
  <text x="92" y="54"
        font-size="30"
        font-weight="800"
        fill="#EAF2FF"
        font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial">
    About me
  </text>
</svg>
