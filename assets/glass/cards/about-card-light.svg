<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0B1220" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0B1220" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="blobA" cx="18%" cy="25%" r="90%">
      <stop offset="0" stop-color="#7CF7FF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#7CF7FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="88%" cy="80%" r="95%">
      <stop offset="0" stop-color="#9B7CFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#9B7CFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip">
      <rect width="900" height="150" rx="26"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="900" height="150" rx="26" fill="url(#base)"/>
    <rect width="900" height="150" rx="26" fill="url(#blobA)"/>
    <rect width="900" height="150" rx="26" fill="url(#blobB)"/>
    <path d="M20 36H880" stroke="#FFFFFF" stroke-opacity="0.45"/>
    <path d="M20 114H880" stroke="#0B1220" stroke-opacity="0.10"/>
  </g>
  <rect x="0.5" y="0.5" width="899" height="149" rx="26" fill="none" stroke="url(#stroke)"/>

  <!-- left bullets -->
  <circle cx="48" cy="62" r="10" fill="#0B1220" fill-opacity="0.04" stroke="#0B1220" stroke-opacity="0.10"/>
  <circle cx="48" cy="96" r="10" fill="#0B1220" fill-opacity="0.04" stroke="#0B1220" stroke-opacity="0.10"/>

  <!-- text -->
  <text x="74" y="70" font-size="22" font-weight="900" fill="#0B1220"
        font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial">
    ⏳ Go developer
  </text>
  <text x="74" y="104" font-size="22" font-weight="900" fill="#0B1220" opacity="0.92"
        font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial">
    🗿 Think tanker, Gen 5
  </text>
</svg>
