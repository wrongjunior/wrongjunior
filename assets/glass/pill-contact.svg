<svg xmlns="http://www.w3.org/2000/svg" width="900" height="92" viewBox="0 0 900 92">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>

    <radialGradient id="blobA" cx="20%" cy="35%" r="75%">
      <stop offset="0" stop-color="#7CF7FF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#7CF7FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blobB" cx="86%" cy="75%" r="85%">
      <stop offset="0" stop-color="#36D5FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#36D5FF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7CF7FF"/>
      <stop offset="1" stop-color="#36D5FF"/>
    </linearGradient>

    <clipPath id="clip">
      <rect x="0" y="0" width="900" height="92" rx="38"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect x="0" y="0" width="900" height="92" rx="38" fill="url(#base)"/>
    <rect x="0" y="0" width="900" height="92" rx="38" fill="url(#blobA)"/>
    <rect x="0" y="0" width="900" height="92" rx="38" fill="url(#blobB)"/>

    <path d="M28 22H872" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
    <path d="M28 70H872" stroke="#000000" stroke-opacity="0.24" stroke-width="1"/>
  </g>

  <rect x="0.5" y="0.5" width="899" height="91" rx="38" fill="none" stroke="url(#stroke)"/>

  <!-- icon -->
  <circle cx="64" cy="46" r="14" fill="url(#accent)" opacity="0.95"/>
  <path d="M58 46h12" stroke="#0B0F16" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>

  <text x="96" y="58"
        font-size="36"
        font-weight="900"
        fill="#EAF2FF"
        font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial">
    Contact
  </text>
</svg>
