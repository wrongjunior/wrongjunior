<svg xmlns="http://www.w3.org/2000/svg" width="900" height="92" viewBox="0 0 900 92">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0B1220" stop-opacity="0.03"/>
    </linearGradient>

    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0B1220" stop-opacity="0.08"/>
    </linearGradient>

    <radialGradient id="blobA" cx="20%" cy="30%" r="75%">
      <stop offset="0" stop-color="#7CF7FF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#7CF7FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blobB" cx="86%" cy="70%" r="85%">
      <stop offset="0" stop-color="#9B7CFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#9B7CFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7CF7FF"/>
      <stop offset="1" stop-color="#9B7CFF"/>
    </linearGradient>

    <clipPath id="clip">
      <rect x="0" y="0" width="900" height="92" rx="38"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect x="0" y="0" width="900" height="92" rx="38" fill="url(#base)"/>
    <rect x="0" y="0" width="900" height="92" rx="38" fill="url(#blobA)"/>
    <rect x="0" y="0" width="900" height="92" rx="38" fill="url(#blobB)"/>

    <!-- micro highlights -->
    <path d="M28 22H872" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1"/>
    <path d="M28 70H872" stroke="#0B1220" stroke-opacity="0.10" stroke-width="1"/>
  </g>

  <rect x="0.5" y="0.5" width="899" height="91" rx="38" fill="none" stroke="url(#stroke)"/>

  <!-- icon -->
  <circle cx="64" cy="46" r="14" fill="url(#accent)" opacity="0.95"/>
  <circle cx="58" cy="40" r="5" fill="#FFFFFF" opacity="0.22"/>

  <!-- title -->
  <text x="96" y="58"
        font-size="36"
        font-weight="900"
        fill="#0B1220"
        font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial">
    About me
  </text>
</svg>
