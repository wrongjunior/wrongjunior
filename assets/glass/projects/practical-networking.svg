<svg xmlns="http://www.w3.org/2000/svg" width="520" height="152" viewBox="0 0 520 152">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="blobA" cx="18%" cy="25%" r="90%">
      <stop offset="0" stop-color="#7CF7FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7CF7FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="88%" cy="78%" r="95%">
      <stop offset="0" stop-color="#9B7CFF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#9B7CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7CF7FF"/>
      <stop offset="1" stop-color="#9B7CFF"/>
    </linearGradient>
    <clipPath id="clip">
      <rect width="520" height="152" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="520" height="152" rx="24" fill="url(#base)"/>
    <rect width="520" height="152" rx="24" fill="url(#blobA)"/>
    <rect width="520" height="152" rx="24" fill="url(#blobB)"/>
    <path d="M16 30H504" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <path d="M16 124H504" stroke="#000000" stroke-opacity="0.22"/>
  </g>
  <rect x="0.5" y="0.5" width="519" height="151" rx="24" fill="none" stroke="url(#stroke)"/>

  <!-- icon -->
  <rect x="18" y="18" width="36" height="36" rx="14" fill="url(#accent)" opacity="0.92"/>
  <circle cx="30" cy="30" r="5" fill="#FFFFFF" opacity="0.14"/>

  <!-- title -->
  <text x="66" y="42" font-size="24" font-weight="900" fill="#EAF2FF"
        font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial">
    practical-networking
  </text>
  <text x="66" y="62" font-size="12" fill="#C9D1D9" opacity="0.82"
        font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial">
    wrongjunior · repository
  </text>

  <!-- chips -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial"
     font-size="11" font-weight="800" fill="#EAF2FF" opacity="0.92">
    <rect x="18" y="98" width="78" height="24" rx="10" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="40" y="114">Notes</text>

    <rect x="104" y="98" width="92" height="24" rx="10" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="126" y="114">Practice</text>
  </g>

  <!-- arrow -->
  <text x="494" y="44" font-size="18" font-weight="900" fill="#EAF2FF" opacity="0.70"
        font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial">↗</text>
</svg>
