<svg xmlns="http://www.w3.org/2000/svg" width="520" height="152" viewBox="0 0 520 152">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0B1220" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0B1220" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="blobA" cx="22%" cy="30%" r="90%">
      <stop offset="0" stop-color="#36D5FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#36D5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="88%" cy="78%" r="95%">
      <stop offset="0" stop-color="#9B7CFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#9B7CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#36D5FF"/>
      <stop offset="1" stop-color="#9B7CFF"/>
    </linearGradient>
    <clipPath id="clip">
      <rect width="520" height="152" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="520" height="152" rx="24" fill="url(#base)"/>
    <rect width="520" height="152" rx="24" fill="url(#blobA)"/>
    <rect width="520" height="152" rx="24" fill="url(#blobB)"/>
    <path d="M16 30H504" stroke="#FFFFFF" stroke-opacity="0.45"/>
    <path d="M16 124H504" stroke="#0B1220" stroke-opacity="0.10"/>
  </g>
  <rect x="0.5" y="0.5" width="519" height="151" rx="24" fill="none" stroke="url(#stroke)"/>

  <rect x="18" y="18" width="36" height="36" rx="14" fill="url(#accent)" opacity="0.92"/>

  <!-- icon: boolean tree (Y-structure, empty rings) -->
  <g stroke="#0B0F16" stroke-opacity="0.55" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- connectors -->
    <path d="M35.94 33.19 L36.00 27.92" stroke-width="2.6"/>
    <path d="M35.94 33.19 L27.95 43.96" stroke-width="2.6"/>
    <path d="M35.94 33.19 L43.91 43.96" stroke-width="2.6"/>

    <!-- junction dot -->
    <circle cx="35.94" cy="33.19" r="1.3" fill="#0B0F16" fill-opacity="0.55" stroke="none"/>

    <!-- rings (drawn on top) -->
    <circle cx="36.00" cy="27.92" r="6.4" stroke-width="2.2"/>
    <circle cx="27.95" cy="43.96" r="6.4" stroke-width="2.2"/>
    <circle cx="43.91" cy="43.96" r="6.4" stroke-width="2.2"/>
  </g>

  <text x="66" y="42" font-size="24" font-weight="900" fill="#0B1220"
        font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial">
    dirTree
  </text>
  <text x="66" y="62" font-size="12" fill="#0B1220" opacity="0.62"
        font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial">
    wrongjunior · repository
  </text>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial"
     font-size="11" font-weight="800" fill="#0B1220" opacity="0.92">
    <rect x="18" y="98" width="56" height="24" rx="10" fill="#0B1220" fill-opacity="0.04" stroke="#0B1220" stroke-opacity="0.10"/>
    <text x="34" y="114">CLI</text>

    <rect x="82" y="98" width="74" height="24" rx="10" fill="#0B1220" fill-opacity="0.04" stroke="#0B1220" stroke-opacity="0.10"/>
    <text x="102" y="114">Utility</text>
  </g>

  <text x="494" y="44" font-size="18" font-weight="900" fill="#0B1220" opacity="0.55"
        font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial">↗</text>
</svg>
